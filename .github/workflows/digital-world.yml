      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup C++ cache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ccache
          fi
          ccache --set-config=max_size=1G
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: volumis-ccache-b6500-ndk28-${{ hashFiles('recovery-project/app/src/main/cpp/**') }}
          restore-keys: volumis-ccache-b6500-ndk28-
      - name: Compile Digital World APK
        working-directory: recovery-project
        env:
          VOLUMIS_KEYSTORE_BASE64: ${{ secrets.VOLUMIS_KEYSTORE_BASE64 }}
          VOLUMIS_STORE_PASSWORD: ${{ secrets.VOLUMIS_STORE_PASSWORD }}
          VOLUMIS_KEY_ALIAS: ${{ secrets.VOLUMIS_KEY_ALIAS }}
          VOLUMIS_KEY_PASSWORD: ${{ secrets.VOLUMIS_KEY_PASSWORD }}
        run: |
          if [ -n "$VOLUMIS_KEYSTORE_BASE64" ]; then
            export VOLUMIS_KEYSTORE_PATH="$RUNNER_TEMP/volumis.jks"
            printf '%s' "$VOLUMIS_KEYSTORE_BASE64" | base64 -d > "$VOLUMIS_KEYSTORE_PATH"
            chmod 600 "$VOLUMIS_KEYSTORE_PATH"
            trap 'rm -f "$VOLUMIS_KEYSTORE_PATH"' EXIT
          fi
          gradle --build-cache --no-daemon assembleDebug
          ccache --show-stats
      - name: Verify and prepare APK
        run: |
          APK=recovery-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libvolumis_native.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/VOLUMIS-0.4-DIGITAL-WORLD.apk
          cd output
          sha256sum VOLUMIS-0.4-DIGITAL-WORLD.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VOLUMIS-0.4-DIGITAL-WORLD
          path: output/
          if-no-files-found: error
