plugins {
    id 'com.android.application'
}

android {

    namespace 'ai.volumis.mobile'

    compileSdk 35

    ndkVersion '28.2.13676358'

    defaultConfig {

        applicationId 'ai.volumis.mobile'

        applicationIdSuffix '.neural'

        minSdk 26

        targetSdk 35

        versionCode 2

        versionName '0.2'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {

            cmake {

                arguments '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Release'

                cppFlags '-std=c++17',
                         '-fexceptions'
            }
        }
    }

    externalNativeBuild {

        cmake {

            path file('src/main/cpp/CMakeLists.txt')

            version '3.22.1'
        }
    }

    buildTypes {

        debug {

            debuggable true

            minifyEnabled false
        }

        release {

            minifyEnabled false
        }
    }

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {

        jniLibs {

            useLegacyPackaging = false
        }
    }
}
